<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <linearGradient id="multicastCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581C87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowD" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGradient)" />

  <!-- Tech Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.4">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675" />
  </g>

  <!-- MAIN TITLE (Portada) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-220" y="-30" width="440" height="40" rx="20" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.5" />
    <text y="-4" fill="#A855F7" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3">PORTADA TÉCNICA DE REDES</text>
    <text y="50" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="1">ESTRUCTURA INTERNA: CLASE D (MULTICAST)</text>
  </g>

  <!-- BIT ARRAY STREAM (32 BITS) -->
  <g transform="translate(100, 175)">
    <!-- Main Container -->
    <rect x="0" y="0" width="1000" height="70" rx="12" fill="#090D16" stroke="#334155" stroke-width="2" />
    
    <!-- 32 Bits Visualization (First four bits '1110' highlighted for Class D Multicast) -->
    <!-- Bit 1 (Fixed 1) -->
    <rect x="15" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="24" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <!-- Bit 2 (Fixed 1) -->
    <rect x="35" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="44" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

    <!-- Bit 3 (Fixed 1) -->
    <rect x="55" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="64" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

    <!-- Bit 4 (Fixed 0) -->
    <rect x="75" y="15" width="18" height="40" rx="3" fill="#A855F7" stroke="#C084FC" stroke-width="1.5" filter="url(#neonGlowD)" />
    <text x="84" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">0</text>

    <!-- Remaining 28 Bits Multicast Group Space -->
    <g fill="#581C87" stroke="#A855F7" stroke-width="1" opacity="0.8">
      <rect x="105" y="15" width="22" height="40" rx="2" /><rect x="130" y="15" width="22" height="40" rx="2" />
      <rect x="155" y="15" width="22" height="40" rx="2" /><rect x="180" y="15" width="22" height="40" rx="2" />
      <rect x="215" y="15" width="22" height="40" rx="2" /><rect x="240" y="15" width="22" height="40" rx="2" />
      <rect x="265" y="15" width="22" height="40" rx="2" /><rect x="290" y="15" width="22" height="40" rx="2" />
      <rect x="325" y="15" width="22" height="40" rx="2" /><rect x="350" y="15" width="22" height="40" rx="2" />
      <rect x="375" y="15" width="22" height="40" rx="2" /><rect x="400" y="15" width="22" height="40" rx="2" />
      <rect x="435" y="15" width="22" height="40" rx="2" /><rect x="460" y="15" width="22" height="40" rx="2" />
      <rect x="485" y="15" width="22" height="40" rx="2" /><rect x="510" y="15" width="22" height="40" rx="2" />
      <rect x="545" y="15" width="22" height="40" rx="2" /><rect x="570" y="15" width="22" height="40" rx="2" />
      <rect x="595" y="15" width="22" height="40" rx="2" /><rect x="620" y="15" width="22" height="40" rx="2" />
      <rect x="655" y="15" width="22" height="40" rx="2" /><rect x="680" y="15" width="22" height="40" rx="2" />
      <rect x="705" y="15" width="22" height="40" rx="2" /><rect x="730" y="15" width="22" height="40" rx="2" />
      <rect x="765" y="15" width="22" height="40" rx="2" /><rect x="790" y="15" width="22" height="40" rx="2" />
      <rect x="815" y="15" width="22" height="40" rx="2" /><rect x="840" y="15" width="22" height="40" rx="2" />
    </g>
  </g>

  <!-- INTERNAL ARCHITECTURE (MULTICAST GROUP DISTRIBUTION) -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="1000" height="330" rx="16" fill="url(#multicastCardGrad)" stroke="#A855F7" stroke-width="2" />
    
    <text x="500" y="35" fill="#C084FC" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">ESPACIO DE DIRECCIONAMIENTO MULTICAST (224.0.0.0 al 239.255.255.255)</text>
    <text x="500" y="55" fill="#E9D5FF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" text-anchor="middle">Sin división tradicional Red/Host: Identificador de Grupo de Difusión Simultánea</text>

    <!-- Bits indicator Box with Fixed Bits Inside -->
    <rect x="250" y="70" width="500" height="55" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1.5" />
    
    <text x="275" y="103" fill="#E9D5FF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="bold">BITS FIJOS:</text>
    
    <!-- Mini Bit Blocks Inside the Box -->
    <g transform="translate(370, 80)">
      <rect x="0" y="5" width="25" height="30" rx="4" fill="#F59E0B" stroke="#FBBF24" stroke-width="1" />
      <text x="12" y="25" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

      <rect x="30" y="5" width="25" height="30" rx="4" fill="#F59E0B" stroke="#FBBF24" stroke-width="1" />
      <text x="42" y="25" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

      <rect x="60" y="5" width="25" height="30" rx="4" fill="#F59E0B" stroke="#FBBF24" stroke-width="1" />
      <text x="72" y="25" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

      <rect x="90" y="5" width="25" height="30" rx="4" fill="#A855F7" stroke="#C084FC" stroke-width="1" />
      <text x="102" y="25" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">0</text>
    </g>

    <text x="525" y="103" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12">(Sin máscara de subred tradicional)</text>

    <!-- Topology: Source to Multiple Receivers -->
    <!-- Source Server -->
    <g transform="translate(150, 215)">
      <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#0F172A" stroke="#C084FC" stroke-width="2" />
      <text x="0" y="-5" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">EMISOR</text>
      <text x="0" y="15" fill="#C084FC" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">Stream / Video</text>
    </g>

    <!-- Broadcast Waves / Multicast Router -->
    <path d="M 210 215 L 350 215" stroke="#C084FC" stroke-width="3" stroke-dasharray="6" fill="none" />

    <g transform="translate(420, 215)">
      <circle cx="0" cy="0" r="35" fill="#3B0764" stroke="#C084FC" stroke-width="2" filter="url(#neonGlowD)" />
      <text x="0" y="5" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ROUTER</text>
    </g>

    <!-- Multi-destination paths -->
    <path d="M 455 215 L 620 150 M 455 215 L 620 215 M 455 215 L 620 280" stroke="#C084FC" stroke-width="2.5" fill="none" />

    <!-- Receiver Group 1 -->
    <g transform="translate(680, 125)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#0F172A" stroke="#9333EA" stroke-width="1.5" />
      <text x="90" y="20" fill="#E9D5FF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Equipos Red Local</text>
      <text x="90" y="38" fill="#C084FC" font-family="monospace" font-size="10" text-anchor="middle">224.0.0.1</text>
    </g>

    <!-- Receiver Group 2 -->
    <g transform="translate(680, 190)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#0F172A" stroke="#9333EA" stroke-width="1.5" />
      <text x="90" y="20" fill="#E9D5FF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Televisores / IPTV</text>
      <text x="90" y="38" fill="#C084FC" font-family="monospace" font-size="10" text-anchor="middle">239.1.1.1</text>
    </g>

    <!-- Receiver Group 3 -->
    <g transform="translate(680, 255)">
      <rect x="0" y="0" width="180" height="50" rx="8" fill="#0F172A" stroke="#9333EA" stroke-width="1.5" />
      <text x="90" y="20" fill="#E9D5FF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Grupo Suscriptores</text>
      <text x="90" y="38" fill="#C084FC" font-family="monospace" font-size="10" text-anchor="middle">Multi-Destino</text>
    </g>
  </g>

</svg>
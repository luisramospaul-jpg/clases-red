<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <linearGradient id="experimentalCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowE" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGradient)" />

  <!-- Tech Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.4">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675" />
  </g>

  <!-- MAIN TITLE (Portada) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-220" y="-30" width="440" height="40" rx="20" fill="#1E293B" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.5" />
    <text y="-4" fill="#F97316" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3">PORTADA TÉCNICA DE REDES</text>
    <text y="50" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="1">ESTRUCTURA INTERNA: CLASE E (EXPERIMENTAL)</text>
  </g>

  <!-- BIT ARRAY STREAM (32 BITS) -->
  <g transform="translate(100, 175)">
    <!-- Main Container -->
    <rect x="0" y="0" width="1000" height="70" rx="12" fill="#090D16" stroke="#334155" stroke-width="2" />
    
    <!-- 32 Bits Visualization -->
    <rect x="15" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="24" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <rect x="35" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="44" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

    <rect x="55" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="64" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

    <rect x="75" y="15" width="18" height="40" rx="3" fill="#F97316" stroke="#FB923C" stroke-width="1.5" filter="url(#neonGlowE)" />
    <text x="84" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

    <!-- Remaining 28 Bits Experimental Research Space -->
    <g fill="#7C2D12" stroke="#F97316" stroke-width="1" opacity="0.8">
      <rect x="105" y="15" width="22" height="40" rx="2" /><rect x="130" y="15" width="22" height="40" rx="2" />
      <rect x="155" y="15" width="22" height="40" rx="2" /><rect x="180" y="15" width="22" height="40" rx="2" />
      <rect x="215" y="15" width="22" height="40" rx="2" /><rect x="240" y="15" width="22" height="40" rx="2" />
      <rect x="265" y="15" width="22" height="40" rx="2" /><rect x="290" y="15" width="22" height="40" rx="2" />
      <rect x="325" y="15" width="22" height="40" rx="2" /><rect x="350" y="15" width="22" height="40" rx="2" />
      <rect x="375" y="15" width="22" height="40" rx="2" /><rect x="400" y="15" width="22" height="40" rx="2" />
      <rect x="435" y="15" width="22" height="40" rx="2" /><rect x="460" y="15" width="22" height="40" rx="2" />
      <rect x="485" y="15" width="22" height="40" rx="2" /><rect x="510" y="15" width="22" height="40" rx="2" />
      <rect x="545" y="15" width="22" height="40" rx="2" /><rect x="570" y="15" width="22" height="40" rx="2" />
      <rect x="595" y="15" width="22" height="40" rx="2" /><rect x="620" y="15" width="22" height="40" rx="2" />
      <rect x="655" y="15" width="22" height="40" rx="2" /><rect x="680" y="15" width="22" height="40" rx="2" />
      <rect x="705" y="15" width="22" height="40" rx="2" /><rect x="730" y="15" width="22" height="40" rx="2" />
      <rect x="765" y="15" width="22" height="40" rx="2" /><rect x="790" y="15" width="22" height="40" rx="2" />
      <rect x="815" y="15" width="22" height="40" rx="2" /><rect x="840" y="15" width="22" height="40" rx="2" />
    </g>
  </g>

  <!-- INTERNAL ARCHITECTURE (EXPERIMENTAL & RESERVED RESEARCH) -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="1000" height="350" rx="16" fill="url(#experimentalCardGrad)" stroke="#F97316" stroke-width="2" />
    
    <text x="500" y="32" fill="#FB923C" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">ESPACIO DE DIRECCIONAMIENTO EXPERIMENTAL (240.0.0.0 al 255.255.255.255)</text>
    <text x="500" y="52" fill="#FED7AA" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" text-anchor="middle">Sin división de red tradicional: Reservado para Investigación, Pruebas y Desarrollo de Protocolos</text>

    <!-- Bits indicator Box with Fixed Bits Inside -->
    <rect x="220" y="65" width="560" height="45" rx="8" fill="#1E293B" stroke="#F97316" stroke-width="1.5" />
    
    <text x="245" y="93" fill="#FED7AA" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="13" font-weight="bold">BITS FIJOS:</text>
    
    <!-- Mini Bit Blocks Inside the Box -->
    <g transform="translate(330, 72)">
      <rect x="0" y="3" width="22" height="25" rx="4" fill="#F59E0B" stroke="#FBBF24" stroke-width="1" />
      <text x="11" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>

      <rect x="26" y="3" width="22" height="25" rx="4" fill="#F59E0B" stroke="#FBBF24" stroke-width="1" />
      <text x="37" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>

      <rect x="52" y="3" width="22" height="25" rx="4" fill="#F59E0B" stroke="#FBBF24" stroke-width="1" />
      <text x="63" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>

      <rect x="78" y="3" width="22" height="25" rx="4" fill="#F97316" stroke="#FB923C" stroke-width="1" />
      <text x="89" y="20" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    </g>

    <text x="460" y="93" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11">(Uso exclusivo en laboratorios)</text>

    <!-- Topology: Lab & Isolation Research (Moved down to avoid overlap) -->
    <!-- Lab Server / R&D -->
    <g transform="translate(150, 225)">
      <rect x="-50" y="-30" width="100" height="60" rx="8" fill="#0F172A" stroke="#FB923C" stroke-width="2" />
      <text x="0" y="-5" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">LABORATORIO</text>
      <text x="0" y="15" fill="#FB923C" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">I+D / Protocolos</text>
    </g>

    <!-- Connection Line to Firewall / Sandbox -->
    <path d="M 210 225 L 350 225" stroke="#FB923C" stroke-width="3" stroke-dasharray="6" fill="none" />

    <g transform="translate(420, 225)">
      <circle cx="0" cy="0" r="35" fill="#431407" stroke="#FB923C" stroke-width="2" filter="url(#neonGlowE)" />
      <text x="0" y="5" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SANDBOX</text>
    </g>

    <!-- Multi-destination paths to isolated testing zones -->
    <path d="M 455 225 L 620 150 M 455 225 L 620 225 M 455 225 L 620 300" stroke="#FB923C" stroke-width="2.5" fill="none" />

    <!-- Research Zone 1 (INVESTIGACIÓN inside box) -->
    <g transform="translate(680, 125)">
      <rect x="0" y="0" width="220" height="50" rx="8" fill="#0F172A" stroke="#C2410C" stroke-width="1.5" />
      <text x="110" y="20" fill="#FED7AA" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">INVESTIGACIÓN</text>
      <text x="110" y="38" fill="#FB923C" font-family="monospace" font-size="10" text-anchor="middle">240.0.0.1 (Reservada)</text>
    </g>

    <!-- Research Zone 2 (INVESTIGACIÓN inside box) -->
    <g transform="translate(680, 200)">
      <rect x="0" y="0" width="220" height="50" rx="8" fill="#0F172A" stroke="#C2410C" stroke-width="1.5" />
      <text x="110" y="20" fill="#FED7AA" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">INVESTIGACIÓN</text>
      <text x="110" y="38" fill="#FB923C" font-family="monospace" font-size="10" text-anchor="middle">Pruebas de Red</text>
    </g>

    <!-- Research Zone 3 (INVESTIGACIÓN inside box) -->
    <g transform="translate(680, 275)">
      <rect x="0" y="0" width="220" height="50" rx="8" fill="#0F172A" stroke="#C2410C" stroke-width="1.5" />
      <text x="110" y="20" fill="#FED7AA" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">INVESTIGACIÓN</text>
      <text x="110" y="38" fill="#FB923C" font-family="monospace" font-size="10" text-anchor="middle">Desarrollo Futuro</text>
    </g>
  </g>

</svg>
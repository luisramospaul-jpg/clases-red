<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>

    <linearGradient id="netCardGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="hostCardGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="675" fill="url(#bgGradient)" />

  <!-- Tech Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" stroke-opacity="0.4">
    <path d="M 0,75 L 1200,75 M 0,150 L 1200,150 M 0,225 L 1200,225 M 0,300 L 1200,300 M 0,375 L 1200,375 M 0,450 L 1200,450 M 0,525 L 1200,525 M 0,600 L 1200,600" />
    <path d="M 150,0 L 150,675 M 300,0 L 300,675 M 450,0 L 450,675 M 600,0 L 600,675 M 750,0 L 750,675 M 900,0 L 900,675 M 1050,0 L 1050,675" />
  </g>

  <!-- MAIN TITLE (Portada) -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <rect x="-220" y="-30" width="440" height="40" rx="20" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.5" />
    <text y="-4" fill="#38BDF8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="3">PORTADA TÉCNICA DE REDES</text>
    <text y="50" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="1">ESTRUCTURA INTERNA: CLASE C</text>
  </g>

  <!-- BIT ARRAY STREAM (32 BITS) -->
  <g transform="translate(100, 175)">
    <!-- Main Container -->
    <rect x="0" y="0" width="1000" height="70" rx="12" fill="#090D16" stroke="#334155" stroke-width="2" />
    
    <!-- 32 Bits Visualization (First three bits '110' highlighted for Class C) -->
    <!-- Bit 1 (Fixed 1) -->
    <rect x="15" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="24" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>
    
    <!-- Bit 2 (Fixed 1) -->
    <rect x="35" y="15" width="18" height="40" rx="3" fill="#F59E0B" stroke="#FBBF24" stroke-width="1.5" />
    <text x="44" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">1</text>

    <!-- Bit 3 (Fixed 0) -->
    <rect x="55" y="15" width="18" height="40" rx="3" fill="#3B82F6" stroke="#60A5FA" stroke-width="1.5" filter="url(#neonGlowC)" />
    <text x="64" y="42" fill="#FFFFFF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">0</text>

    <!-- Remaining 21 Bits Network (Rest of 1st Octet + 2nd & 3rd Octets) -->
    <g fill="#1E3A8A" stroke="#3B82F6" stroke-width="1">
      <!-- Rest of 1st Octet (5 bits) -->
      <rect x="78" y="15" width="15" height="40" rx="2" /><rect x="95" y="15" width="15" height="40" rx="2" />
      <rect x="112" y="15" width="15" height="40" rx="2" /><rect x="129" y="15" width="15" height="40" rx="2" />
      <rect x="146" y="15" width="15" height="40" rx="2" />
      
      <!-- Entire 2nd Octet (8 bits) -->
      <rect x="170" y="15" width="16" height="40" rx="2" /><rect x="188" y="15" width="16" height="40" rx="2" />
      <rect x="206" y="15" width="16" height="40" rx="2" /><rect x="224" y="15" width="16" height="40" rx="2" />
      <rect x="242" y="15" width="16" height="40" rx="2" /><rect x="260" y="15" width="16" height="40" rx="2" />
      <rect x="278" y="15" width="16" height="40" rx="2" /><rect x="296" y="15" width="16" height="40" rx="2" />

      <!-- Entire 3rd Octet (8 bits) -->
      <rect x="320" y="15" width="16" height="40" rx="2" /><rect x="338" y="15" width="16" height="40" rx="2" />
      <rect x="356" y="15" width="16" height="40" rx="2" /><rect x="374" y="15" width="16" height="40" rx="2" />
      <rect x="392" y="15" width="16" height="40" rx="2" /><rect x="410" y="15" width="16" height="40" rx="2" />
      <rect x="428" y="15" width="16" height="40" rx="2" /><rect x="446" y="15" width="16" height="40" rx="2" />
    </g>

    <!-- Divider Line (24 bits Network / 8 bits Host) -->
    <line x1="475" y1="10" x2="475" y2="60" stroke="#00F2FE" stroke-width="3" stroke-dasharray="4" />

    <!-- 8 Bits Host (4th Octet) -->
    <g fill="#064E3B" stroke="#10B981" stroke-width="1" opacity="0.8">
      <rect x="500" y="15" width="30" height="40" rx="3" /><rect x="535" y="15" width="30" height="40" rx="3" />
      <rect x="570" y="15" width="30" height="40" rx="3" /><rect x="605" y="15" width="30" height="40" rx="3" />
      <rect x="640" y="15" width="30" height="40" rx="3" /><rect x="675" y="15" width="30" height="40" rx="3" />
      <rect x="710" y="15" width="30" height="40" rx="3" /><rect x="745" y="15" width="30" height="40" rx="3" />
    </g>
  </g>

  <!-- INTERNAL ARCHITECTURE (2 MAIN DIVISIONS) -->
  
  <!-- LEFT PANEL: NETWORK ID ARCHITECTURE (24 BITS) -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="330" height="330" rx="16" fill="url(#netCardGradC)" stroke="#3B82F6" stroke-width="2" />
    
    <text x="165" y="35" fill="#60A5FA" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">NETWORK ID</text>
    <text x="165" y="55" fill="#93C5FD" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" text-anchor="middle">3 Octetos (24 Bits / /24)</text>

    <!-- Bits indicator -->
    <rect x="20" y="75" width="290" height="60" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1" />
    <text x="35" y="100" fill="#F59E0B" font-family="monospace" font-size="15" font-weight="bold">BITS FIJOS: 110</text>
    <text x="35" y="120" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11">Identificador exclusivo de Clase C</text>

    <!-- Home Router Core Icon -->
    <g transform="translate(165, 210)">
      <circle cx="0" cy="0" r="35" fill="#1E3A8A" stroke="#60A5FA" stroke-width="2" filter="url(#neonGlowC)" />
      <path d="M -10 5 L 0 -10 L 10 5 Z M -6 5 L -6 12 L 6 12 L 6 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>

    <text x="165" y="280" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Red Pequeña / Hogar</text>
    <text x="165" y="300" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="11" text-anchor="middle">Ej: 192.168.1.0/24</text>
  </g>

  <!-- RIGHT PANEL: HOST ID INTERNAL HIERARCHY (8 BITS) -->
  <g transform="translate(460, 280)">
    <rect x="0" y="0" width="640" height="330" rx="16" fill="url(#hostCardGradC)" stroke="#10B981" stroke-width="2" />

    <text x="320" y="35" fill="#34D399" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">HOST ID - DISPOSITIVOS LOCALES</text>
    <text x="320" y="55" fill="#A7F3D0" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" text-anchor="middle">1 Octeto (8 Bits) - Hasta 254 dispositivos por red</text>

    <!-- INTERNAL TOPOLOGY MAP (Home LAN) -->
    <g transform="translate(320, 110)">
      <rect x="-60" y="-20" width="120" height="40" rx="6" fill="#065F46" stroke="#34D399" stroke-width="2" />
      <text x="0" y="5" fill="#FFFFFF" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ROUTER WI-FI</text>
    </g>

    <!-- Connecting Bus Lines -->
    <path d="M 320 130 L 320 170 M 140 170 L 500 170 M 140 170 L 140 200 M 320 170 L 320 200 M 500 170 L 500 200" stroke="#34D399" stroke-width="2" fill="none" />

    <!-- Device 1: Router Gateway -->
    <g transform="translate(70, 200)">
      <rect x="0" y="0" width="140" height="100" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.5" />
      <text x="70" y="25" fill="#34D399" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Gateway</text>
      <circle cx="70" cy="55" r="12" fill="#10B981" />
      <text x="70" y="85" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">.1 (Router)</text>
    </g>

    <!-- Device 2: Smartphone / PC -->
    <g transform="translate(250, 200)">
      <rect x="0" y="0" width="140" height="100" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.5" />
      <text x="70" y="25" fill="#34D399" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Celular / PC</text>
      <rect x="55" y="45" width="30" height="20" fill="#34D399" rx="3" />
      <text x="70" y="85" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">.15 (Dispositivo)</text>
    </g>

    <!-- Device 3: Smart TV / IoT -->
    <g transform="translate(430, 200)">
      <rect x="0" y="0" width="140" height="100" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.5" />
      <text x="70" y="25" fill="#34D399" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Smart Devices</text>
      <path d="M 55 50 L 85 50 L 85 65 L 55 65 Z" fill="#34D399" />
      <text x="70" y="85" fill="#94A3B8" font-family="&#39;Segoe UI&#39;, Roboto, sans-serif" font-size="10" text-anchor="middle">.X (IoT / TV)</text>
    </g>
  </g>

  <!-- FLOW ARROW BETWEEN NETWORK AND HOST -->
  <path d="M 430 445 L 460 445" stroke="#00F2FE" stroke-width="4" fill="none" />

</svg>